<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Tiny Memories Magnet Co.</title>

  <style>
    :root {
      --cream: #faf7f0;
      --cream-dark: #f1ebe1;
      --white: #fffdf9;
      --charcoal: #383432;
      --text-light: #68615c;
      --rose: #b97968;
      --rose-dark: #a96858;
      --sage: #899780;
      --border: #e5ddd1;
      --gold: #c6a36a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--cream);
      color: var(--charcoal);
      font-family: Georgia, "Times New Roman", serif;
    }

    .topbar {
      background: var(--charcoal);
      color: white;
      padding: 18px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .topbar h1 {
      margin: 0;
      font-size: 24px;
    }

    .topbar button {
      border: 1px solid rgba(255,255,255,.4);
      background: transparent;
      color: white;
      padding: 9px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-family: inherit;
    }

    .topbar button:hover {
      background: rgba(255,255,255,.1);
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 30px 20px 60px;
    }

    .login-box {
      max-width: 430px;
      margin: 80px auto;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 8px 30px rgba(56,52,50,.08);
      text-align: center;
    }

    .login-box h2 {
      margin-top: 0;
      margin-bottom: 10px;
    }

    .login-box p {
      color: var(--text-light);
      line-height: 1.5;
    }

    .login-box input {
      width: 100%;
      padding: 13px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-family: inherit;
      font-size: 16px;
      margin: 12px 0;
    }

    .login-box button {
      width: 100%;
      padding: 13px;
      border: 0;
      border-radius: 8px;
      background: var(--rose);
      color: white;
      font-family: inherit;
      font-size: 16px;
      cursor: pointer;
    }

    .login-box button:hover {
      background: var(--rose-dark);
    }

    .error {
      color: #a33;
      margin-top: 12px;
      min-height: 20px;
    }

    .hidden {
      display: none !important;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 30px;
    }

    .stat {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
    }

    .stat-label {
      color: var(--text-light);
      font-size: 14px;
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 28px;
      font-weight: bold;
    }

    .order-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 14px;
      margin-bottom: 24px;
      overflow: hidden;
    }

    .order-header {
      background: var(--cream-dark);
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
    }

    .order-header h2 {
      margin: 0 0 5px;
      font-size: 19px;
    }

    .order-date {
      color: var(--text-light);
      font-size: 14px;
    }

    .status {
      background: var(--sage);
      color: white;
      padding: 7px 12px;
      border-radius: 20px;
      font-size: 13px;
      height: fit-content;
    }

    .order-body {
      padding: 20px;
    }

    .section {
      margin-bottom: 25px;
    }

    .section:last-child {
      margin-bottom: 0;
    }

    .section h3 {
      margin: 0 0 10px;
      font-size: 17px;
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px 25px;
    }

    .info-row {
      line-height: 1.5;
    }

    .label {
      color: var(--text-light);
      font-size: 13px;
    }

    .items {
      display: grid;
      gap: 10px;
    }

    .item {
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 12px;
      display: flex;
      justify-content: space-between;
      gap: 15px;
    }

    .item-name {
      font-weight: bold;
    }

    .item-details {
      color: var(--text-light);
      font-size: 14px;
      margin-top: 4px;
    }

    .custom-photo {
      max-width: 130px;
      max-height: 130px;
      border-radius: 8px;
      border: 1px solid var(--border);
      margin-top: 10px;
      display: block;
    }

    .totals {
      max-width: 350px;
      margin-left: auto;
    }

    .total-row {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
    }

    .grand-total {
      border-top: 1px solid var(--border);
      margin-top: 8px;
      padding-top: 12px;
      font-size: 19px;
      font-weight: bold;
    }

    .notes {
      background: var(--cream-dark);
      border-radius: 8px;
      padding: 12px;
      white-space: pre-wrap;
    }

    .empty {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-light);
    }

    .loading {
      text-align: center;
      padding: 50px;
    }

    @media (max-width: 700px) {
      .stats {
        grid-template-columns: 1fr;
      }

      .info-grid {
        grid-template-columns: 1fr;
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

  <!-- LOGIN -->
  <div id="loginScreen" class="login-box">
    <h2>Admin Login</h2>
    <p>Enter your admin password to view orders.</p>

    <form id="loginForm">
      <input
        type="password"
        id="passwordInput"
        placeholder="Admin password"
        autocomplete="current-password"
        required
      >

      <button type="submit">Sign In</button>

      <div id="loginError" class="error"></div>
    </form>
  </div>


  <!-- ADMIN DASHBOARD -->
  <div id="dashboard" class="hidden">

    <div class="topbar">
      <h1>Tiny Memories Magnet Co. — Admin</h1>
      <button id="logoutButton">Log Out</button>
    </div>

    <div class="container">

      <div class="stats">
        <div class="stat">
          <div class="stat-label">Orders</div>
          <div class="stat-value" id="orderCount">0</div>
        </div>

        <div class="stat">
          <div class="stat-label">Paid Orders</div>
          <div class="stat-value" id="paidCount">0</div>
        </div>

        <div class="stat">
          <div class="stat-label">Sales</div>
          <div class="stat-value" id="salesTotal">$0.00</div>
        </div>
      </div>

      <div id="ordersContainer">
        <div class="loading">Loading orders...</div>
      </div>

    </div>
  </div>


  <script>
    const loginScreen = document.getElementById("loginScreen");
    const dashboard = document.getElementById("dashboard");
    const loginForm = document.getElementById("loginForm");
    const passwordInput = document.getElementById("passwordInput");
    const loginError = document.getElementById("loginError");
    const logoutButton = document.getElementById("logoutButton");

    let adminPassword = "";

    loginForm.addEventListener("submit", async function(event) {
      event.preventDefault();

      const password = passwordInput.value.trim();

      if (!password) {
        loginError.textContent = "Please enter your password.";
        return;
      }

      loginError.textContent = "Checking password...";

      try {
        const response = await fetch("/api/admin/orders", {
          headers: {
            "x-admin-password": password
          }
        });

        if (response.status === 401) {
          loginError.textContent = "Incorrect password.";
          passwordInput.value = "";
          passwordInput.focus();
          return;
        }

        if (!response.ok) {
          throw new Error("Unable to access admin orders.");
        }

        const orders = await response.json();

        adminPassword = password;

        loginScreen.classList.add("hidden");
        dashboard.classList.remove("hidden");

        renderOrders(orders);

      } catch (error) {
        console.error(error);
        loginError.textContent =
          "Could not connect to the server. Make sure it is running.";
      }
    });


    logoutButton.addEventListener("click", function() {
      adminPassword = "";

      dashboard.classList.add("hidden");
      loginScreen.classList.remove("hidden");

      passwordInput.value = "";
      loginError.textContent = "";
      passwordInput.focus();
    });


    function money(value) {
      return "$" + Number(value || 0).toFixed(2);
    }


    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }


    function formatDate(value) {
      if (!value) return "";

      const date = new Date(value);

      if (Number.isNaN(date.getTime())) {
        return value;
      }

      return date.toLocaleString();
    }


    function renderOrders(orders) {
      const container = document.getElementById("ordersContainer");

      const paidOrders = orders.filter(order => order.status === "PAID");

      const salesTotal = paidOrders.reduce(
        (sum, order) => sum + Number(order.total || 0),
        0
      );

      document.getElementById("orderCount").textContent = orders.length;
      document.getElementById("paidCount").textContent = paidOrders.length;
      document.getElementById("salesTotal").textContent = money(salesTotal);

      if (!orders.length) {
        container.innerHTML = `
          <div class="empty">
            <h2>No orders yet</h2>
            <p>Completed orders will appear here.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = orders.map(order => {

        const customer = order.customer || {};
        const shipping = order.shipping || {};

        const itemsHtml = (order.items || []).map(item => {

          const itemName = escapeHtml(item.name || "Item");
          const quantity = Number(item.quantity || 1);

          let photoHtml = "";

          if (
            item.type === "custom" &&
            item.photos &&
            item.photos.length &&
            item.photos[0].dataUrl
          ) {
            photoHtml = `
              <img
                class="custom-photo"
                src="${item.photos[0].dataUrl}"
                alt="Customer photo"
              >
            `;
          }

          let details = "";

          if (item.type === "custom") {
            details = `
              <div>Custom photo magnets</div>
              <div>Quantity: ${quantity}</div>
              ${item.customerName ? `<div>Name: ${escapeHtml(item.customerName)}</div>` : ""}
              ${item.customerEmail ? `<div>Email: ${escapeHtml(item.customerEmail)}</div>` : ""}
              ${item.customerPhone ? `<div>Phone: ${escapeHtml(item.customerPhone)}</div>` : ""}
              ${item.instructions ? `<div>Instructions: ${escapeHtml(item.instructions)}</div>` : ""}
              ${photoHtml}
            `;
          } else {
            details = `
              <div>SKU: ${escapeHtml(item.sku || "")}</div>
              <div>Quantity: ${quantity}</div>
            `;
          }

          return `
            <div class="item">
              <div>
                <div class="item-name">${itemName}</div>
                <div class="item-details">${details}</div>
              </div>

              <strong>${money(item.lineTotal || 0)}</strong>
            </div>
          `;

        }).join("");


        const address = [
          shipping.address,
          shipping.address2,
          shipping.city,
          shipping.state,
          shipping.zip,
          shipping.country
        ]
        .filter(Boolean)
        .map(escapeHtml)
        .join("<br>");


        return `
          <div class="order-card">

            <div class="order-header">
              <div>
                <h2>Order ${escapeHtml(order.paypalOrderId || order.id || "")}</h2>
                <div class="order-date">
                  ${escapeHtml(formatDate(order.createdAt))}
                </div>
              </div>

              <div class="status">
                ${escapeHtml(order.status || "PENDING")}
              </div>
            </div>


            <div class="order-body">

              <div class="section">
                <h3>Customer</h3>

                <div class="info-grid">

                  <div class="info-row">
                    <div class="label">Name</div>
                    ${escapeHtml(
                      [customer.firstName, customer.lastName]
                        .filter(Boolean)
                        .join(" ")
                    )}
                  </div>

                  <div class="info-row">
                    <div class="label">Email</div>
                    ${escapeHtml(customer.email || "")}
                  </div>

                  <div class="info-row">
                    <div class="label">Phone</div>
                    ${escapeHtml(customer.phone || "")}
                  </div>

                  <div class="info-row">
                    <div class="label">Shipping Address</div>
                    ${address}
                  </div>

                </div>
              </div>


              <div class="section">
                <h3>Items</h3>

                <div class="items">
                  ${itemsHtml}
                </div>
              </div>


              ${
                order.orderNotes
                  ? `
                    <div class="section">
                      <h3>Order Notes</h3>
                      <div class="notes">
                        ${escapeHtml(order.orderNotes)}
                      </div>
                    </div>
                  `
                  : ""
              }


              <div class="section">

                <div class="totals">

                  <div class="total-row">
                    <span>Merchandise</span>
                    <span>${money(order.merchandiseTotal)}</span>
                  </div>

                  <div class="total-row">
                    <span>Shipping</span>
                    <span>${money(order.shippingTotal)}</span>
                  </div>

                  <div class="total-row grand-total">
                    <span>Total</span>
                    <span>${money(order.total)}</span>
                  </div>

                </div>

              </div>

            </div>
          </div>
        `;

      }).join("");
    }
  </script>

</body>
</html>
