<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vendor Orders | Tiny Memories</title><style>body{font:16px system-ui;background:#fbf8f2;color:#364333;margin:0;padding:20px}main{max-width:850px;margin:auto}h1{font-family:Georgia;color:#52664d}input,button{font:inherit;padding:10px;border-radius:8px;border:1px solid #aab5a4}button{background:#748b70;color:white;cursor:pointer}article{background:white;border:1px solid #ddd7ca;border-radius:14px;padding:18px;margin:14px 0}small{color:#666}a{color:#52664d}#message{color:#9a3535}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}</style><main><h1>Vendor Market Orders ♡</h1><p>Private staff page. Do not share this URL or password with customers.</p><label>Admin password <input id="password" type="password" autocomplete="off"></label> <button id="load">Load orders</button><p id="message" role="alert"></p><div class="actions"><button id="endEvent" type="button">End Event: Archive Picked-Up Orders</button><button id="history" type="button">View Order History</button><button id="active" type="button">View Active Orders</button><button id="export" type="button">Download Sales CSV</button></div><div id="orders"></div></main><script>
const $=id=>document.getElementById(id);const steps={AWAITING_PAYMENT:['PAID','Mark paid'],PAID:['IN_PROGRESS','Start making'],IN_PROGRESS:['READY','Mark ready'],READY:['PICKED_UP','Picked up']};let password='';
async function api(path,opts={}){const r=await fetch(path,{...opts,headers:{'x-admin-password':password,...(opts.headers||{})},cache:'no-store'});if(!r.ok){let j=await r.json().catch(()=>({}));throw Error(j.error||'Request failed')}return r}
let view='active';let currentOrders=[];async function load(){password=$('password').value;$('message').textContent='';try{const data=await (await api(view==='history'?'/api/admin/vendor-orders/archived':'/api/admin/vendor-orders')).json();currentOrders=data;$('orders').replaceChildren();for(const o of data){const card=document.createElement('article');const h=document.createElement('h2');h.textContent=o.id+' • '+o.name;card.append(h);const detail=document.createElement('p');detail.textContent=`${o.quantity} magnets • $${Number(o.total).toFixed(2)} • ${o.status}`;card.append(detail);const info=document.createElement('p');info.textContent=`Contact: ${o.contact||'Not provided'} | Notes: ${o.notes||'None'}`;card.append(info);const photos=document.createElement('div');photos.className='actions';for(let i=1;i<=o.photoCount;i++){const b=document.createElement('button');b.textContent='Download photo '+i;b.onclick=async()=>{try{const r=await api('/api/admin/vendor-orders/'+encodeURIComponent(o.id)+'/photos/'+i);const blob=await r.blob();const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=o.id+'-photo-'+i+'.'+(blob.type==='image/png'?'png':blob.type==='image/heic'?'heic':'jpg');a.click();setTimeout(()=>URL.revokeObjectURL(url),60000)}catch(e){$('message').textContent=e.message}};photos.append(b)}card.append(photos);if(view==='history'){const del=document.createElement('button');del.textContent='Permanently delete order and photos';del.onclick=async()=>{if(!confirm('Permanently delete '+o.id+' and its photos? This cannot be undone.'))return;if(!confirm('FINAL CONFIRMATION: delete this archived order permanently?'))return;try{await api('/api/admin/vendor-orders/'+encodeURIComponent(o.id)+'/delete',{method:'POST'});await load()}catch(e){$('message').textContent=e.message}};card.append(del)}if(view==='active' && steps[o.status]){const [status,label]=steps[o.status];const b=document.createElement('button');b.textContent=label;b.onclick=async()=>{if(!confirm('Change '+o.id+' to '+status+'?'))return;try{await api('/api/admin/vendor-orders/'+encodeURIComponent(o.id)+'/status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});await load()}catch(e){$('message').textContent=e.message}};card.append(b)}$('orders').append(card)}if(!data.length)$('orders').textContent='No vendor orders yet.'}catch(e){$('message').textContent=e.message}}
$('load').onclick=load;
$('history').onclick=()=>{view='history';load()};
$('active').onclick=()=>{view='active';load()};
$('endEvent').onclick=async()=>{password=$('password').value;if(!confirm('Archive all PICKED UP vendor orders? Unfinished orders will stay active.'))return;try{const r=await (await api('/api/admin/vendor-orders/archive',{method:'POST'})).json();view='active';await load();$('message').textContent=r.archived+' completed orders archived.'}catch(e){$('message').textContent=e.message}};
$('export').onclick=()=>{if(!currentOrders.length){$('message').textContent='Load orders first.';return}const cols=['id','createdAt','archivedAt','name','contact','quantity','total','status','notes'];const esc=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const csv=[cols.join(','),...currentOrders.map(o=>cols.map(k=>esc(o[k])).join(','))].join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='vendor-'+view+'-orders.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),10000)};
</script></html>
